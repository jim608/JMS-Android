# Include this fragment once inside the existing JMS server block.
location = /jms-config.json {
    if ($request_method !~ "^(GET|HEAD)$") { return 405; }
    alias /run/jms-private/jms-config.json;
    types { }
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    access_log off;
    error_log /dev/null;
    error_page 404 = @jms_entry_config_missing;
}

location @jms_entry_config_missing {
    types { }
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    return 404 '{"error":"configuration_not_found"}';
}
