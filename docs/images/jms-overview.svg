<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">JMS：你的 Jellyfin，隨處觀看</title>
  <desc id="description">JMS 影音用戶端功能示意。支援 Android、Windows 與 Linux，提供瀏覽、播放、字幕與選用的點片功能。需自備 Jellyfin；部分功能依伺服器設定。右側為繪製的介面示意，不是實際影片或產品截圖。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101d29"/>
      <stop offset="1" stop-color="#080f19"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity=".18"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#174b53"/>
      <stop offset=".55" stop-color="#28394b"/>
      <stop offset="1" stop-color="#a98353"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#245860"/>
      <stop offset="1" stop-color="#142a3b"/>
    </linearGradient>
    <clipPath id="art-clip"><rect x="674" y="176" width="446" height="267" rx="18"/></clipPath>
  </defs>
  <g font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',system-ui,sans-serif">
    <rect width="1200" height="700" rx="28" fill="url(#background)"/>
    <ellipse cx="943" cy="276" rx="410" ry="360" fill="url(#glow)"/>
    <path d="M620 60V620" stroke="#273745" stroke-opacity=".6"/>
    <circle cx="70" cy="62" r="5" fill="#5eead4"/>
    <text x="88" y="67" font-size="13" font-weight="600" letter-spacing="2.4" fill="#a9c4cf">JIM608 MEDIA SERVER</text>

    <!-- JMS mark paths reused from icons/jms/mark.svg. -->
    <g transform="translate(-24 -50) scale(.4)" fill="none" stroke="#f2f8f8" stroke-width="48" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="222,402 332,402 332,586 298,622 254,622 220,586"/>
      <polyline points="414,622 414,402 512,526 610,402 610,622"/>
      <polyline points="804,402 710,402 678,438 678,478 710,512 772,512 804,548 804,586 772,622 678,622"/>
    </g>
    <rect x="332" y="149" width="122" height="31" rx="15.5" fill="#183c3e" stroke="#35605d"/>
    <text x="393" y="170" text-anchor="middle" font-size="14" font-weight="600" fill="#8cebd9">影音用戶端</text>
    <text x="64" y="269" font-size="43" font-weight="700" letter-spacing="-.8" fill="#f2f8f8">你的 Jellyfin，隨處觀看</text>
    <text x="66" y="312" font-size="21" fill="#a4b8c6">以熟悉的介面，連接你的影音收藏。</text>

    <g font-size="16" font-weight="600" fill="#d7e6ed">
      <rect x="64" y="352" width="152" height="45" rx="22.5" fill="#142632" stroke="#304653"/>
      <rect x="231" y="352" width="158" height="45" rx="22.5" fill="#142632" stroke="#304653"/>
      <rect x="404" y="352" width="137" height="45" rx="22.5" fill="#142632" stroke="#304653"/>
      <g fill="none" stroke="#74ddca" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="84" y="363" width="13" height="23" rx="3"/><path d="M89 382h3"/>
        <path d="M251 364h9v9h-9zm12 0h9v9h-9zm-12 12h9v9h-9zm12 0h9v9h-9z"/>
        <rect x="425" y="364" width="23" height="20" rx="3"/><path d="m430 370 4 4-4 4m8 0h5"/>
      </g>
      <text x="109" y="381">Android</text>
      <text x="284" y="381">Windows</text>
      <text x="459" y="381">Linux</text>
    </g>

    <text x="66" y="451" font-size="13" font-weight="600" letter-spacing="1.6" fill="#7f9aa9">讓觀看回到內容本身</text>
    <g>
      <rect x="64" y="471" width="119" height="123" rx="17" fill="#13232f" stroke="#2b414e"/>
      <rect x="197" y="471" width="119" height="123" rx="17" fill="#13232f" stroke="#2b414e"/>
      <rect x="330" y="471" width="119" height="123" rx="17" fill="#13232f" stroke="#2b414e"/>
      <rect x="463" y="471" width="119" height="123" rx="17" fill="#13232f" stroke="#2b414e"/>
      <g fill="none" stroke="#6ae0cb" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <rect x="108" y="496" width="12" height="12" rx="2"/><rect x="126" y="496" width="12" height="12" rx="2"/>
        <rect x="108" y="514" width="12" height="12" rx="2"/><rect x="126" y="514" width="12" height="12" rx="2"/>
        <circle cx="256" cy="511" r="19"/><path d="m252 502 13 9-13 9z" fill="#6ae0cb" stroke="none"/>
        <rect x="371" y="496" width="37" height="28" rx="5"/><path d="M377 506h10m5 0h9m-24 7h5m5 0h14"/>
        <rect x="505" y="496" width="34" height="28" rx="5"/><path d="M522 503v14m-7-7h14"/>
      </g>
      <g text-anchor="middle" font-size="20" font-weight="600" fill="#e1edf1">
        <text x="123" y="565">瀏覽</text><text x="256" y="565">播放</text>
        <text x="389" y="565">字幕</text><text x="522" y="565">點片</text>
      </g>
    </g>

    <rect x="650" y="117" width="494" height="473" rx="25" fill="#0d1924" stroke="#35505c"/>
    <circle cx="679" cy="145" r="4" fill="#5eead4"/>
    <text x="694" y="150" font-size="13" font-weight="600" fill="#b4cbd5">你的媒體庫</text>
    <rect x="1030" y="132" width="90" height="25" rx="12.5" fill="#27312e"/>
    <text x="1075" y="149" text-anchor="middle" font-size="12" fill="#e8ca8d">功能示意</text>
    <g clip-path="url(#art-clip)">
      <rect x="674" y="176" width="446" height="267" fill="url(#art)"/>
      <circle cx="1047" cy="230" r="70" fill="#f2d192" opacity=".65"/>
      <path d="M654 367 790 232 916 359 1023 301 1145 406V462H654Z" fill="#173743"/>
      <path d="M654 425 822 314 967 416 1081 356 1145 402V462H654Z" fill="#102936"/>
      <path d="M674 422c133-32 249-11 446-60v81H674Z" fill="#0d222e"/>
      <path d="M785 200c65 55 119 55 192 11" fill="none" stroke="#80d7c5" stroke-opacity=".23" stroke-width="2"/>
    </g>
    <circle cx="897" cy="303" r="34" fill="#071a22" fill-opacity=".64" stroke="#d7efe7" stroke-opacity=".7"/>
    <path d="m888 287 25 16-25 16z" fill="#effaf5"/>
    <rect x="693" y="419" width="407" height="3" rx="1.5" fill="#698b95" fill-opacity=".4"/>
    <rect x="693" y="419" width="137" height="3" rx="1.5" fill="#6ce4cd"/>
    <circle cx="830" cy="420.5" r="4" fill="#b3f4e5"/>
    <g>
      <rect x="674" y="465" width="137" height="65" rx="10" fill="url(#tile)"/>
      <rect x="828" y="465" width="137" height="65" rx="10" fill="#303c4c"/>
      <rect x="982" y="465" width="138" height="65" rx="10" fill="#48483d"/>
      <path d="m674 526 48-36 50 40m56-3 58-42 79 45m17-3 55-35 83 38" fill="none" stroke="#a4d5ca" stroke-opacity=".3" stroke-width="2"/>
      <g font-size="14" fill="#b9cbd4">
        <text x="674" y="556">繼續觀看</text><text x="828" y="556">收藏片單</text><text x="982" y="556">最近加入</text>
      </g>
    </g>
    <text x="897" y="626" text-anchor="middle" font-size="19" font-weight="500" fill="#e9cc94">讓每一個螢幕，都有熟悉的收藏。</text>
    <path d="M64 637v17" stroke="#57cbb7" stroke-width="3" stroke-linecap="round"/>
    <text x="78" y="651" font-size="15" fill="#91a9b8">需自備 Jellyfin；部分功能依伺服器設定。</text>
  </g>
</svg>
