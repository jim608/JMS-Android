name: JMS Linux 驗證

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: 已推送至 jms 的完整共用來源提交
        required: true
        type: string
      candidate_run:
        description: 已完成的候選工作流程編號；空白時建置新候選
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: jms-linux-${{ inputs.source_commit }}
  cancel-in-progress: false

jobs:
  linux:
    if: github.repository == 'jim608/JMS-Android' && github.ref == 'refs/heads/jms'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4.1.1
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          submodules: recursive
      - name: 核對已推送的共用來源
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          git fetch origin jms
          git merge-base --is-ancestor "$SOURCE_COMMIT" origin/jms
          test -z "$(git status --porcelain)"
          VERSION=$(sed -n 's/^version: \([^+]*\)+.*/\1/p' pubspec.yaml)
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_ID=JMS-$VERSION-linux-${SOURCE_COMMIT:0:12}" >> "$GITHUB_ENV"
      - name: 核對獨立且固定的容器收尾工具
        env:
          VALIDATION_TOOL_COMMIT: ${{ github.sha }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          [[ "$VALIDATION_TOOL_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse "$VALIDATION_TOOL_COMMIT^{commit}")" = "$VALIDATION_TOOL_COMMIT"
          git merge-base --is-ancestor "$SOURCE_COMMIT" "$VALIDATION_TOOL_COMMIT"
          test -z "$(git status --porcelain)"
          tools="$RUNNER_TEMP/jms-validation-tools"
          mkdir -p "$tools"
          git show "$VALIDATION_TOOL_COMMIT:scripts/jms_docker_cleanup.py" > "$tools/jms_docker_cleanup.py"
          git show "$VALIDATION_TOOL_COMMIT:scripts/test_jms_docker_cleanup.py" > "$tools/test_jms_docker_cleanup.py"
          python3 -m unittest discover -s "$tools" -p test_jms_docker_cleanup.py
          export JMS_DOCKER_CLEANUP_HELPER="$tools/jms_docker_cleanup.py"
          export JMS_VALIDATION_TOOLS_BINDING="$tools/binding.json"
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          helper = pathlib.Path(os.environ['JMS_DOCKER_CLEANUP_HELPER'])
          test = helper.with_name('test_jms_docker_cleanup.py')
          pathlib.Path(os.environ['JMS_VALIDATION_TOOLS_BINDING']).write_text(json.dumps({
              'sourceCommit': os.environ['SOURCE_COMMIT'],
              'validationToolCommit': os.environ['VALIDATION_TOOL_COMMIT'],
              'helperSha256': hashlib.sha256(helper.read_bytes()).hexdigest(),
              'testsSha256': hashlib.sha256(test.read_bytes()).hexdigest(),
              'appWorkspaceModified': False}, indent=2))
          PY
          echo "JMS_DOCKER_CLEANUP_HELPER=$JMS_DOCKER_CLEANUP_HELPER" >> "$GITHUB_ENV"
          echo "JMS_VALIDATION_TOOLS_BINDING=$JMS_VALIDATION_TOOLS_BINDING" >> "$GITHUB_ENV"
          test -z "$(git status --porcelain)"
      - name: 建置並檢查安全工作階段
        if: inputs.candidate_run == ''
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          mkdir -p cleanup
          docker build --target package -f Dockerfile.linux --build-arg JMS_BUILD_ID="$BUILD_ID" --build-arg JMS_SOURCE_COMMIT="$SOURCE_COMMIT" -t jms-linux-candidate .
          export_cid=$(python3 "$JMS_DOCKER_CLEANUP_HELPER" --ledger cleanup/linux.json create --image jms-linux-candidate --purpose linux-package-export -- --name jms-linux-export jms-linux-candidate /bin/true)
          mkdir candidate
          docker cp "$export_cid:/output/." candidate/
          python3 "$JMS_DOCKER_CLEANUP_HELPER" --ledger cleanup/linux.json run --image jms-linux-candidate --purpose linux-secret-service-test -- -v "$PWD:/src:ro" -e JMS_ISOLATED_SECRET_TEST=1 jms-linux-candidate bash -ec 'apt-get update >/dev/null; apt-get install -y --no-install-recommends gnome-keyring procps >/dev/null; bash /src/scripts/test_jms_linux_secret.sh' > candidate/secret-service-test.log
          python3 - <<'PY'
          import json, os, pathlib
          pathlib.Path('candidate/runner-source.json').write_text(json.dumps({key: os.environ[key] for key in ('SOURCE_COMMIT', 'VERSION', 'BUILD_ID', 'GITHUB_RUN_ID')}, indent=2))
          PY
      - name: 接續既有候選
        if: inputs.candidate_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh run download "$RUN_ID" --name "jms-linux-$SOURCE_COMMIT" --dir candidate
      - name: 核對候選身分與校驗清單
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          (cd candidate && sha256sum --check SHA256SUMS.txt)
          python3 - <<'PY'
          import json, os, pathlib
          build = json.loads(pathlib.Path('candidate/build-manifest.json').read_text())['build']
          for key, expected in {'sourceCommit': os.environ['SOURCE_COMMIT'], 'versionName': os.environ['VERSION'], 'buildId': os.environ['BUILD_ID'], 'platform': 'linux-x64'}.items():
              assert build[key] == expected, 'Candidate identity differs: ' + key
          assert 'cross-process restore, daemon restart, isolation, clear' in pathlib.Path('candidate/secret-service-test.log').read_text()
          PY
      - name: 驗證診斷接收器與三種 Web 容器
        if: inputs.candidate_run == ''
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          docker build -f Dockerfile.web --build-arg JMS_VERSION="$VERSION" --build-arg JMS_SOURCE_COMMIT="$SOURCE_COMMIT" --build-arg JMS_BUILD_ID="JMS-$VERSION-web-${SOURCE_COMMIT:0:12}" -t jms-diagnostics-web-test .
          export_cid=$(python3 "$JMS_DOCKER_CLEANUP_HELPER" --ledger cleanup/linux.json create --image jms-diagnostics-web-test --purpose diagnostics-web-export -- --name jms-diagnostics-web-export jms-diagnostics-web-test)
          mkdir -p build/web
          docker cp "$export_cid:/usr/share/nginx/html/." build/web/
          JMS_ISOLATED_DIAGNOSTICS_TEST=1 JMS_DIAGNOSTICS_WEB_IMAGE=jms-diagnostics-web-test bash scripts/test_jms_diagnostics_container.sh
      - uses: actions/upload-artifact@v4
        if: inputs.candidate_run == ''
        with:
          name: jms-linux-${{ inputs.source_commit }}
          path: |
            candidate/*.pkg.tar.xz
            candidate/*.tar.gz
            candidate/build-manifest.json
            candidate/build-packages.tsv
            candidate/SHA256SUMS.txt
            candidate/secret-service-test.log
            candidate/runner-source.json
          if-no-files-found: error
          retention-days: 14
      - name: 取得已發布的升級基線
        run: |
          curl --fail --location https://github.com/jim608/JMS-Linux/releases/download/v0.11.1-jms.22/JMS-Linux-0.11.1-jms.22-x86_64.pkg.tar.xz -o candidate/previous.pkg.tar.xz
          echo 'cfc45e8aff6ecd53ac702b190031b06ab6789bb5fadc1c9365de0f76138ac915  candidate/previous.pkg.tar.xz' | sha256sum --check
      - name: 驗證 Arch 安裝、升級、啟動與設定保留
        env:
          VALIDATION_COMMIT: ${{ github.sha }}
        run: |
          mkdir validation
          git show "$VALIDATION_COMMIT:scripts/test_jms_linux_install.sh" > validation/install-test.sh
          printf '%s\n' "$VALIDATION_COMMIT" > validation/validation-tools-commit.txt
          docker pull archlinux:base
          python3 "$JMS_DOCKER_CLEANUP_HELPER" --ledger cleanup/linux.json run --image archlinux:base --purpose linux-arch-install-test -- -v "$PWD/candidate:/candidate:ro" -v "$PWD/validation:/output" -v "$PWD/validation/install-test.sh:/test.sh:ro" -e JMS_ISOLATED_INSTALL_TEST=1 archlinux:base bash /test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jms-linux-install-validation-${{ inputs.source_commit }}
          path: validation/
          if-no-files-found: warn
          retention-days: 14
      - name: 封存並移除已結束的測試容器
        if: always()
        run: |
          cleanup_result=0
          if test -n "${JMS_VALIDATION_TOOLS_BINDING:-}"; then
            mkdir -p cleanup
            cp "$JMS_VALIDATION_TOOLS_BINDING" cleanup/validation-tools-binding.json
          fi
          if test -f cleanup/linux.json; then
            python3 "${JMS_DOCKER_CLEANUP_HELPER:-scripts/jms_docker_cleanup.py}" --ledger cleanup/linux.json cleanup || cleanup_result=1
          fi
          if test -f cleanup/diagnostics.json; then
            python3 "${JMS_DOCKER_CLEANUP_HELPER:-scripts/jms_docker_cleanup.py}" --ledger cleanup/diagnostics.json cleanup || cleanup_result=1
          fi
          exit "$cleanup_result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jms-container-cleanup-${{ inputs.source_commit }}
          path: cleanup/
          if-no-files-found: warn
          retention-days: 14
