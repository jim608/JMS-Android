name: Build JMS

on:
  push:
    tags:
      - "v*"
    branches:
      - master
  pull_request:
    paths:
      - pubspec.yaml
      - .github/workflows/build.yml
      - .fvmrc
    types:
      - opened
      - reopened
  schedule:
    # Run nightly at midnight UTC, but only if there were changes to develop
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type (release, nightly)"
        required: false
        default: "nightly"
        type: choice
        options:
          - release
          - nightly
          - jms-candidates
          - jms-validate-linux
      source_commit:
        description: "Exact pushed JMS source commit for isolated Linux/Web candidates"
        required: false
        type: string
      candidate_run:
        description: "Completed candidate workflow run to validate"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NIGHTLY_TAG: nightly

jobs:
  jms-validate-linux:
    if: github.repository == 'jim608/JMS-Android' && github.event_name == 'workflow_dispatch' && inputs.build_type == 'jms-validate-linux'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4.1.1
      - name: Download exact candidate and published upgrade baseline
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          gh run download "$RUN_ID" --name "jms-linux-$SOURCE_COMMIT" --dir candidate
          (cd candidate && sha256sum --check SHA256SUMS.txt)
          curl --fail --location https://github.com/jim608/JMS-Linux/releases/download/v0.11.1-jms.21/JMS-Linux-0.11.1-jms.21-x86_64.pkg.tar.xz -o candidate/previous.pkg.tar.xz
          echo 'fa373413b2a0e1d69fb284be07085ca94addfcacb87cff52f7968d29828cf28b  candidate/previous.pkg.tar.xz' | sha256sum --check
      - name: Verify install, upgrade, portable and retained settings
        run: |
          mkdir validation
          docker run --rm -v "$PWD/candidate:/candidate:ro" -v "$PWD/validation:/output" -v "$PWD/scripts/test_jms_linux_install.sh:/test.sh:ro" -e JMS_ISOLATED_INSTALL_TEST=1 archlinux:base bash /test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jms-linux-install-validation-${{ inputs.source_commit }}
          path: validation/
          if-no-files-found: error
          retention-days: 14

  jms-candidates:
    if: github.repository == 'jim608/JMS-Android' && github.event_name == 'workflow_dispatch' && inputs.build_type == 'jms-candidates'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: [linux, web]
    steps:
      - uses: actions/checkout@v4.1.1
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          submodules: recursive
      - name: Verify immutable source
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          git fetch origin jms
          git merge-base --is-ancestor "$SOURCE_COMMIT" origin/jms
          test -z "$(git status --porcelain)"
          VERSION=$(sed -n 's/^version: \([^+]*\)+.*/\1/p' pubspec.yaml)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_ID=JMS-$VERSION-${{ matrix.platform }}-${SOURCE_COMMIT:0:12}" >> "$GITHUB_ENV"
      - name: Build Linux packages
        if: matrix.platform == 'linux'
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          docker build --target package -f Dockerfile.linux --build-arg JMS_BUILD_ID="$BUILD_ID" --build-arg JMS_SOURCE_COMMIT="$SOURCE_COMMIT" -t jms-candidate .
          docker create --name jms-export jms-candidate /bin/true
          mkdir candidate
          docker cp jms-export:/output/. candidate/
          docker run --rm -v "$PWD:/src:ro" -e JMS_ISOLATED_SECRET_TEST=1 jms-candidate bash -ec 'apt-get update >/dev/null; apt-get install -y --no-install-recommends gnome-keyring procps >/dev/null; bash /src/scripts/test_jms_linux_secret.sh' > candidate/secret-service-test.log
      - name: Build and test Web container
        if: matrix.platform == 'web'
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          docker build -f Dockerfile.web --build-arg JMS_VERSION="$VERSION" --build-arg JMS_SOURCE_COMMIT="$SOURCE_COMMIT" --build-arg JMS_BUILD_ID="$BUILD_ID" -t jms-candidate .
          docker run -d --name jms-web-test -p 18081:8080 jms-candidate
          for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:18081/healthz && break; sleep 1; done
          JMS_TEST_ORIGIN=http://127.0.0.1:18081 python3 -m unittest discover -s scripts -p test_jms_web_container.py
          mkdir -p candidate/site
          docker cp jms-web-test:/usr/share/nginx/html/. candidate/site/
          docker image inspect jms-candidate > candidate/image-record.json
          docker save jms-candidate | gzip > candidate/JMS-Web-container.tar.gz
      - name: Record source identity
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          pathlib.Path('candidate/runner-source.json').write_text(json.dumps({key: os.environ[key] for key in ('SOURCE_COMMIT', 'VERSION', 'BUILD_ID', 'PLATFORM', 'GITHUB_RUN_ID')}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: jms-${{ matrix.platform }}-${{ inputs.source_commit }}
          path: |
            candidate/*.json
            candidate/*.txt
            candidate/*.tsv
            candidate/*.log
            candidate/*.xz
            candidate/*.gz
            candidate/site/
          if-no-files-found: error
          retention-days: 14

  # Check if workflow should run based on trigger conditions
  check-trigger:
    if: inputs.build_type != 'jms-candidates' && inputs.build_type != 'jms-validate-linux'
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      build_type: ${{ steps.check.outputs.build_type }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0

      - name: Check if should run and determine build type
        id: check
        run: |
          # Determine build type based on trigger and input
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            BUILD_TYPE="${{ github.event.inputs.build_type }}"
          elif [[ "${{ startsWith(github.ref, 'refs/tags/v') }}" == "true" ]]; then
            BUILD_TYPE="release"
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            # Check if there were commits to develop in the last 24 hours
            git checkout develop
            COMMITS_LAST_24H=$(git log --since="24 hours ago" --oneline | wc -l)
            if [[ $COMMITS_LAST_24H -gt 0 ]]; then
              BUILD_TYPE="nightly"
            else
              echo "No commits to develop in the last 24 hours, skipping nightly build"
              echo "should_run=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            BUILD_TYPE="nightly"
          else
            # For PRs and other events, build but don't release
            BUILD_TYPE="development"
          fi

          echo "build_type=${BUILD_TYPE}" >> $GITHUB_OUTPUT
          echo "should_run=true" >> $GITHUB_OUTPUT
          echo "Build type determined: ${BUILD_TYPE}"

  fetch-info:
    needs: [check-trigger]
    if: needs.check-trigger.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.fetch.outputs.version_name }}
      flutter_version: ${{ steps.fetch.outputs.flutter_version }}
      nightly_version: ${{ steps.fetch.outputs.nightly_version }}
      build_type: ${{ needs.check-trigger.outputs.build_type }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0

      - name: Fetch version name and create nightly version
        id: fetch
        run: |
          # Extract version_name from pubspec.yaml
          VERSION_NAME=$(grep '^version:' pubspec.yaml | cut -d ':' -f2 | cut -d '+' -f1 | tr -d ' ')
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"

          # Extract flutter_version from .fvmrc
          FLUTTER_VERSION=$(jq -r '.flutter' .fvmrc)
          echo "flutter_version=${FLUTTER_VERSION}" >> "$GITHUB_OUTPUT"

          # Create nightly version if needed
          if [[ "${{ needs.check-trigger.outputs.build_type }}" == "nightly" ]]; then
            NIGHTLY_VERSION="${VERSION_NAME}-nightly"
            echo "nightly_version=${NIGHTLY_VERSION}" >> "$GITHUB_OUTPUT"
            echo "Nightly version: $NIGHTLY_VERSION"
          fi

          # Print versions for logging
          echo "Base version: $VERSION_NAME"
          echo "Flutter version: $FLUTTER_VERSION"
        shell: bash

  build-android:
    needs: [fetch-info]
    runs-on: ubuntu-latest
    outputs:
      artifact_suffix: ${{ env.ARTIFACT_SUFFIX }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.1

      - name: Determine Build Type
        run: |
          echo "ARTIFACT_SUFFIX=${{ needs.fetch-info.outputs.build_type }}" >> $GITHUB_ENV
          echo "ARTIFACT_SUFFIX=${{ needs.fetch-info.outputs.build_type }}" >> $GITHUB_OUTPUT

      - name: Decode Keystore for release
        if: needs.fetch-info.outputs.build_type != 'development'
        env:
          ENCODED_STRING: ${{ secrets.KEYSTORE_BASE_64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEYSTORE_ALIAS: ${{ secrets.RELEASE_KEYSTORE_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          echo "$ENCODED_STRING" | base64 -d > android/app/keystore.jks

          # Create the key.properties file
          cat > android/app/key.properties <<EOF
          storePassword=$RELEASE_KEYSTORE_PASSWORD
          keyPassword=$RELEASE_KEY_PASSWORD
          keyAlias=$RELEASE_KEYSTORE_ALIAS
          EOF

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
          check-latest: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.19.0
        with:
          channel: "stable"
          flutter-version: ${{needs.fetch-info.outputs.flutter_version}}
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android APK (PRs)
        if: needs.fetch-info.outputs.build_type == 'development'
        run: |
          flutter build apk --debug --split-per-abi --build-number=${{github.run_number}} --flavor production

      - name: Build Android APK and AAB
        if: needs.fetch-info.outputs.build_type != 'development'
        run: |
          flutter build apk --release --split-per-abi --build-number=${{github.run_number}} --flavor production
          flutter build appbundle --release --build-number=${{github.run_number}} --flavor production

      - name: Rename APK for PR
        if: needs.fetch-info.outputs.build_type == 'development'
        run: |
          mkdir -p build/app/outputs/android_artifacts
          # Move split debug APKs
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-production-debug.apk build/app/outputs/android_artifacts/${{ env.ARTIFACT_SUFFIX }}-armeabi-v7a.apk || true
          cp build/app/outputs/flutter-apk/app-arm64-v8a-production-debug.apk build/app/outputs/android_artifacts/${{ env.ARTIFACT_SUFFIX }}-arm64-v8a.apk || true
          cp build/app/outputs/flutter-apk/app-x86_64-production-debug.apk build/app/outputs/android_artifacts/${{ env.ARTIFACT_SUFFIX }}-x86_64.apk || true

      - name: Rename APK and AAB
        if: needs.fetch-info.outputs.build_type != 'development'
        run: |
          mkdir -p build/app/outputs/android_artifacts
          # Move split APKs
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-production-release.apk build/app/outputs/android_artifacts/${{ env.ARTIFACT_SUFFIX }}-armeabi-v7a.apk || true
          cp build/app/outputs/flutter-apk/app-arm64-v8a-production-release.apk build/app/outputs/android_artifacts/${{ env.ARTIFACT_SUFFIX }}-arm64-v8a.apk || true
          cp build/app/outputs/flutter-apk/app-x86_64-production-release.apk build/app/outputs/android_artifacts/${{ env.ARTIFACT_SUFFIX }}-x86_64.apk || true
          # Move AAB
          mv build/app/outputs/bundle/productionRelease/app-production-release.aab build/app/outputs/android_artifacts/${{ env.ARTIFACT_SUFFIX }}.aab

      - name: Archive Android artifacts
        uses: actions/upload-artifact@v4.0.0
        with:
          name: jms-android
          path: build/app/outputs/android_artifacts/

  build-windows:
    runs-on: windows-2022
    needs: [fetch-info]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.19.0
        with:
          channel: "stable"
          flutter-version: ${{needs.fetch-info.outputs.flutter_version}}
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows EXE
        run: flutter build windows --build-number=${{ github.run_number }}

      - name: Compile Inno Setup installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: windows/windows_setup.iss
          options: /O+ /DJMS_VERSION="${{ needs.fetch-info.outputs.version_name }}"

      - name: Archive Windows portable artifact
        uses: actions/upload-artifact@v4.0.0
        with:
          name: jms-windows-portable
          path: build\windows\x64\runner\Release\

      - name: Archive Windows installer artifact
        uses: actions/upload-artifact@v4.0.0
        with:
          name: jms-windows-installer
          path: windows\Output\jms_setup.exe

  build-ios:
    runs-on: macos-latest
    needs: [fetch-info]

    steps:
      # - uses: maxim-lobanov/setup-xcode@v1.6.0
      #   with:
      #     xcode-version: latest-stable

      - name: Checkout repository
        uses: actions/checkout@v4.1.1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.19.0
        with:
          channel: "stable"
          flutter-version: ${{needs.fetch-info.outputs.flutter_version}}
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS app
        run: flutter build ipa --no-codesign --flavor production --build-number=${{ github.run_number }}

      - name: Create unsigned IPA
        run: |
          cd build/ios/archive/Runner.xcarchive/Products/Applications/
          mkdir Payload
          mv Runner.app Payload/
          zip -r iOS.ipa Payload
      - name: Archive iOS IPA artifact
        uses: actions/upload-artifact@v4.0.0
        with:
          name: jms-iOS
          path: build/ios/archive/Runner.xcarchive/Products/Applications/iOS.ipa

  build-macos:
    runs-on: macos-latest
    needs: [fetch-info]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.19.0
        with:
          channel: "stable"
          flutter-version: ${{needs.fetch-info.outputs.flutter_version}}
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"

      - name: Get dependencies
        run: flutter pub get

      - name: Build macOS app
        run: flutter build macos --flavor production --build-number=${{ github.run_number }}

      - name: Ensure correct app name casing
        run: |
          APP_DIR="build/macos/Build/Products/Release-production"
          test -d "$APP_DIR/JMS.app"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG with custom background
        run: ./scripts/create_dmg.sh

      - name: Archive macOS artifact
        uses: actions/upload-artifact@v4.0.0
        with:
          name: jms-macOS
          path: build/macos/Build/Products/Release-production/macOS.dmg

  build-linux:
    runs-on: ubuntu-latest
    needs: [fetch-info]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.19.0
        with:
          channel: "stable"
          flutter-version: ${{needs.fetch-info.outputs.flutter_version}}
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"

      - name: Update build number in pubspec.yaml
        run: |
          sed -i -E 's/(version: [0-9]+\.[0-9]+\.[0-9]+\+)[0-9]+/\1${{ github.run_number }}/' pubspec.yaml

      - name: Get dependencies
        run: flutter pub get

      - name: Get packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev patchelf cmake clang libfuse2

      - name: Build Linux app
        run: flutter build linux --release --build-number=${{ github.run_number }}

      - name: Fix RPATH
        run: |
          for lib in "build/linux/x64/release/bundle/lib"/*.so; do
            [[ -f "$lib" && -n "$(patchelf --print-rpath "$lib")" ]] && \
            patchelf --set-rpath '$ORIGIN' "$lib"
          done
          patchelf --set-rpath '$ORIGIN/lib' "build/linux/x64/release/bundle/jms"

      - name: Archive Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: jms-linux
          path: build/linux/x64/release/bundle

      - name: Build AppImage
        run: |
          VERSION_TO_USE="${{ needs.fetch-info.outputs.version_name }}"
          sed -i -E "s/(version:\\s*)latest/\\1${VERSION_TO_USE}/" AppImageBuilder.yml
          wget -O appimage-builder-x86_64.AppImage https://github.com/AppImageCrafters/appimage-builder/releases/download/v1.1.0/appimage-builder-1.1.0-x86_64.AppImage
          chmod +x appimage-builder-x86_64.AppImage
          sudo mv appimage-builder-x86_64.AppImage /usr/local/bin/appimage-builder
          appimage-builder --recipe AppImageBuilder.yml

      - name: Archive Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: jms-linux-appimage
          path: |
            JMS_x86_64.AppImage
            JMS_x86_64.AppImage.zsync

  build-linux-flatpak:
    runs-on: ubuntu-latest
    if: vars.JMS_RELEASES_ENABLED == 'true' && (needs.fetch-info.outputs.build_type == 'release' || needs.fetch-info.outputs.build_type == 'nightly')
    needs: [fetch-info, build-linux]
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-46
      options: --privileged
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.1
        with:
          submodules: true

      - name: Download Artifacts Linux
        uses: actions/download-artifact@v4
        with:
          name: jms-linux
          path: build/linux/x64/release/bundle

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: JMS-Linux.flatpak
          manifest-path: flatpak/com.jim608.jms.yaml

      - name: Archive Linux Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: jms-linux-flatpak
          path: JMS-Linux.flatpak

  build-web:
    runs-on: ubuntu-latest
    needs: [fetch-info]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.19.0
        with:
          channel: "stable"
          flutter-version: ${{needs.fetch-info.outputs.flutter_version}}
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"

      - name: Get dependencies
        run: flutter pub get

      - name: Build web app
        run: |
          flutter build web --release --build-number=${{github.run_number}}

      - name: Archive web artifact
        uses: actions/upload-artifact@v4.0.0
        with:
          name: jms-web
          path: build/web

      - name: Build Github pages web
        if: vars.JMS_RELEASES_ENABLED == 'true' && needs.fetch-info.outputs.build_type == 'release'
        run: flutter build web --base-href /${{ github.event.repository.name }}/ --release --build-number=$GITHUB_RUN_NUMBER

      - name: Archive web pages artifact
        if: vars.JMS_RELEASES_ENABLED == 'true' && needs.fetch-info.outputs.build_type == 'release'
        uses: actions/upload-artifact@v4.0.0
        with:
          name: jms-web-pages
          path: build/web

  create_release:
    name: Create Release
    needs:
      - fetch-info
      - build-android
      - build-windows
      - build-ios
      - build-macos
      - build-linux
      - build-linux-flatpak
      - build-web
    runs-on: ubuntu-latest
    # JMS 使用受審查的平台發布器；此混合平台流程僅保留給上游。
    if: github.repository == 'DonutWare/Fladder' && vars.JMS_RELEASES_ENABLED == 'true' && (needs.fetch-info.outputs.build_type == 'release' || needs.fetch-info.outputs.build_type == 'nightly')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        if: needs.fetch-info.outputs.build_type == 'nightly'
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0

      - name: Set version variables
        id: version
        run: |
          if [[ "${{ needs.fetch-info.outputs.build_type }}" == "nightly" ]]; then
            echo "version=${{ needs.fetch-info.outputs.nightly_version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ needs.fetch-info.outputs.version_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Delete existing nightly release
        if: needs.fetch-info.outputs.build_type == 'nightly'
        run: |
          # Delete existing nightly release and tag with better error handling
          echo "Checking for existing nightly release..."
          if gh release view ${{ env.NIGHTLY_TAG }} >/dev/null 2>&1; then
            echo "Deleting existing nightly release..."
            gh release delete ${{ env.NIGHTLY_TAG }} --yes --cleanup-tag
          else
            echo "No existing nightly release found."
          fi

          # Clean up any orphaned tags
          if git tag -l | grep -q "^${{ env.NIGHTLY_TAG }}$"; then
            echo "Deleting orphaned nightly tag..."
            git push origin --delete ${{ env.NIGHTLY_TAG }} || true
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate changelog
        if: needs.fetch-info.outputs.build_type == 'nightly'
        id: changelog
        run: |
          # Get the latest stable release tag for comparison
          LATEST_STABLE_RELEASE=$(gh release list --limit 50 --exclude-drafts --json tagName,isPrerelease --jq '.[] | select(.isPrerelease == false) | .tagName' | head -1 || echo "")

          # Create new changelog with comparison link
          cat > changelog.md <<-EOF
          # $(date -u "+%Y-%m-%d %H:%M:%S UTC")

          This is an automated nightly build containing the latest changes from the develop branch.

          **⚠️ Warning:** This is a development build and may contain bugs or incomplete features.
          EOF

          # Add comparison link if we have a latest stable release
          if [ -n "$LATEST_STABLE_RELEASE" ]; then
            cat >> changelog.md <<-EOF

          ## 📋 What's Changed

          See all changes since the latest release: [Compare $LATEST_STABLE_RELEASE...HEAD](https://github.com/${{ github.repository }}/compare/$LATEST_STABLE_RELEASE...HEAD)
          EOF
          else
            cat >> changelog.md <<-EOF

          ## 📋 What's Changed

          See all changes: [View commits](https://github.com/${{ github.repository }}/commits/develop)
          EOF
          fi

          # Add build metadata
          cat >> changelog.md <<-EOF

          ---

          📅 **Build Date:** $(date -u "+%Y-%m-%d %H:%M:%S UTC")
          🔧 **Build Number:** ${{ github.run_number }}
          📝 **Commit:** ${{ github.sha }}
          🌿 **Branch:** develop
          EOF

          echo "changelog_file=changelog.md" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Artifacts Android
        uses: actions/download-artifact@v4
        with:
          name: jms-android
          path: jms-android

      - name: Move Android
        run: |
          mv jms-android/${{ needs.build-android.outputs.artifact_suffix }}-armeabi-v7a.apk JMS-Android-${{ steps.version.outputs.version }}-armeabi-v7a.apk || true
          mv jms-android/${{ needs.build-android.outputs.artifact_suffix }}-arm64-v8a.apk JMS-Android-${{ steps.version.outputs.version }}-arm64-v8a.apk || true
          mv jms-android/${{ needs.build-android.outputs.artifact_suffix }}-x86_64.apk JMS-Android-${{ steps.version.outputs.version }}-x86_64.apk || true
          mv jms-android/${{ needs.build-android.outputs.artifact_suffix }}.aab JMS-Android-${{ steps.version.outputs.version }}.aab

      - name: Download Windows portable artifact
        uses: actions/download-artifact@v4
        with:
          name: jms-windows-portable
          path: jms-windows-portable

      - name: Compress Windows
        run: |
          cd jms-windows-portable
          zip -r ../JMS-Windows-${{ steps.version.outputs.version }}.zip .

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: jms-windows-installer
          path: jms-windows-installer

      - name: Rename Windows installer
        run: mv jms-windows-installer/jms_setup.exe JMS-Windows-${{ steps.version.outputs.version }}-Setup.exe

      - name: Download Artifacts iOS
        uses: actions/download-artifact@v4
        with:
          name: jms-iOS
          path: jms-iOS

      - name: Move iOS
        run: mv jms-iOS/iOS.ipa JMS-iOS-${{ steps.version.outputs.version }}.ipa

      - name: Download Artifacts macOS
        uses: actions/download-artifact@v4
        with:
          name: jms-macOS
          path: jms-macOS

      - name: Move macOS
        run: mv jms-macOS/macOS.dmg JMS-macOS-${{ steps.version.outputs.version }}.dmg

      - name: Download Artifacts Linux
        uses: actions/download-artifact@v4
        with:
          name: jms-linux
          path: jms-linux

      - name: Compress Linux
        run: |
          cd jms-linux
          zip -r ../JMS-Linux-${{ steps.version.outputs.version }}.zip .

      - name: Download Artifacts Linux Flatpak
        if: vars.JMS_RELEASES_ENABLED == 'true' && needs.fetch-info.outputs.build_type == 'release'
        uses: actions/download-artifact@v4
        with:
          name: jms-linux-flatpak
          path: jms-linux-flatpak

      - name: Move Linux Flatpak
        if: vars.JMS_RELEASES_ENABLED == 'true' && needs.fetch-info.outputs.build_type == 'release'
        run: mv jms-linux-flatpak/JMS-Linux.flatpak JMS-Linux-${{ steps.version.outputs.version }}.flatpak

      - name: Download Artifacts Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: jms-linux-appimage
          path: jms-linux-appimage

      - name: Move Linux AppImages
        run: |
          mv jms-linux-appimage/JMS_x86_64.AppImage JMS-Linux-${{ steps.version.outputs.version }}.AppImage
          mv jms-linux-appimage/JMS_x86_64.AppImage.zsync JMS-Linux-${{ steps.version.outputs.version }}.AppImage.zsync
      - name: Download Artifacts Web
        uses: actions/download-artifact@v4
        with:
          name: jms-web
          path: jms-web

      - name: Compress Web
        run: |
          cd jms-web
          zip -r ../JMS-Web-${{ steps.version.outputs.version }}.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v2.2.2
        with:
          tag_name: ${{ needs.fetch-info.outputs.build_type == 'nightly' && env.NIGHTLY_TAG || github.ref_name }}
          name: ${{ needs.fetch-info.outputs.build_type == 'nightly' && format('🌙 Nightly Build - {0}', steps.version.outputs.version) || '' }}
          body_path: ${{ needs.fetch-info.outputs.build_type == 'nightly' && 'changelog.md' || '' }}
          draft: ${{ needs.fetch-info.outputs.build_type == 'release' }}
          prerelease: ${{ needs.fetch-info.outputs.build_type == 'nightly' }}
          make_latest: ${{ needs.fetch-info.outputs.build_type == 'release' }}
          generate_release_notes: ${{ needs.fetch-info.outputs.build_type == 'release' }}
          fail_on_unmatched_files: true
          files: |
            JMS-Android-${{ steps.version.outputs.version }}-arm64-v8a.apk
            JMS-Android-${{ steps.version.outputs.version }}-armeabi-v7a.apk
            JMS-Android-${{ steps.version.outputs.version }}-x86_64.apk
            JMS-Android-${{ steps.version.outputs.version }}.aab
            JMS-Windows-${{ steps.version.outputs.version }}-Setup.exe
            JMS-Windows-${{ steps.version.outputs.version }}.zip
            JMS-iOS-${{ steps.version.outputs.version }}.ipa
            JMS-macOS-${{ steps.version.outputs.version }}.dmg
            JMS-Web-${{ steps.version.outputs.version }}.zip
            JMS-Linux-${{ steps.version.outputs.version }}.zip
            JMS-Linux-${{ steps.version.outputs.version }}.AppImage
            JMS-Linux-${{ steps.version.outputs.version }}.AppImage.zsync
            ${{ needs.fetch-info.outputs.build_type == 'release' && format('JMS-Linux-{0}.flatpak', steps.version.outputs.version) || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release_play_console:
    if: vars.JMS_RELEASES_ENABLED == 'true'
    name: Upload AAB to Google Play Console
    needs:
      - fetch-info
      - create_release
      - build-android
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts Android
        uses: actions/download-artifact@v4
        with:
          name: jms-android
          path: jms-android

      - name: Upload AAB to Google Play Console
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: "com.jim608.jms"
          releaseFiles: "jms-android/${{ needs.build-android.outputs.artifact_suffix }}.aab"
          track: ${{ needs.fetch-info.outputs.build_type == 'nightly' && 'internal' || 'production' }}
          status: ${{ needs.fetch-info.outputs.build_type == 'nightly' && 'completed' || 'draft' }}
          releaseName: "${{ github.run_number }} (${{ needs.fetch-info.outputs.version_name }})"

  release_web:
    name: Release Web
    needs:
      - fetch-info
      - create_release
    runs-on: ubuntu-latest
    if: vars.JMS_RELEASES_ENABLED == 'true' && needs.fetch-info.outputs.build_type == 'release'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.1

      - name: Download Artifacts Web
        uses: actions/download-artifact@v4
        with:
          name: jms-web
          path: build/web

      - name: Deploy to ghcr.io
        uses: mr-smithers-excellent/docker-build-push@v6
        with:
          image: jms
          addLatest: true
          multiPlatform: true
          platform: linux/amd64,linux/arm64,linux/arm/v7
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy rootless-image to ghcr.io
        uses: mr-smithers-excellent/docker-build-push@v6
        with:
          dockerfile: Dockerfile-rootless
          image: jms-rootless
          addLatest: true
          multiPlatform: true
          platform: linux/amd64,linux/arm64,linux/arm/v7
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean builds folder
        run: rm -rf build/web

      - name: Download Artifacts Web
        uses: actions/download-artifact@v4
        with:
          name: jms-web-pages
          path: build/web

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web

